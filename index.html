/* No external chart library — hand-built so the sandboxed preview never crashes */

function MiniBarChart({ data, width = 300, height = 100, highlightMax = false, threshold }) {
  const max = Math.max(...data.map((d) => d.v), threshold || 0) * 1.15;
  const barW = width / data.length;
  return (
    <svg viewBox={`0 0 ${width} ${height}`} className="w-full" style={{ height }}>
      {threshold && (
        <line
          x1="0" x2={width}
          y1={height - (threshold / max) * height} y2={height - (threshold / max) * height}
          stroke="#dc2626" strokeWidth="1.5" strokeDasharray="4 3"
        />
      )}
      {data.map((d, i) => {
        const h = (d.v / max) * height;
        const isPeak = highlightMax ? d.v === Math.max(...data.map((x) => x.v)) : threshold && d.v > threshold;
        return (
          <rect
            key={i}
            x={i * barW + barW * 0.18}
            y={height - h}
            width={barW * 0.64}
            height={h}
            rx="2"
            fill={isPeak ? "#dc2626" : "#818cf8"}
          />
        );
      })}
    </svg>
  );
}

function MiniLineChart({ data, width = 340, height = 140 }) {
  const vals = data.map((d) => d.observed ?? d.predicted ?? 0);
  const max = Math.max(...vals) * 1.1;
  const min = 0;
  const stepX = width / (data.length - 1);
  const y = (v) => height - ((v - min) / (max - min)) * height;

  const observedPts = data.filter((d) => d.observed != null).map((d, i) => [i * stepX, y(d.observed)]);
  const predictedPts = data
    .map((d, i) => (d.predicted != null ? [i * stepX, y(d.predicted)] : null))
    .filter(Boolean);

  const toPath = (pts) => pts.map((p, i) => `${i === 0 ? "M" : "L"}${p[0]},${p[1]}`).join(" ");

  return (
    <svg viewBox={`0 0 ${width} ${height}`} className="w-full" style={{ height }}>
      <path d={toPath(observedPts)} fill="none" stroke="#312e81" strokeWidth="2.5" />
      <path d={toPath(predictedPts)} fill="none" stroke="#f59e0b" strokeWidth="2.5" strokeDasharray="5 4" />
      {observedPts.map((p, i) => (
        <circle key={"o" + i} cx={p[0]} cy={p[1]} r="2.5" fill="#312e81" />
      ))}
      {predictedPts.map((p, i) => (
        <circle key={"p" + i} cx={p[0]} cy={p[1]} r="2.5" fill="#f59e0b" />
      ))}
      <text x={width - 4} y={12} textAnchor="end" fontSize="9" fill="#312e81" fontWeight="600">Observed</text>
      <text x={width - 4} y={24} textAnchor="end" fontSize="9" fill="#f59e0b" fontWeight="600">Predicted</text>
    </svg>
  );
}

function StatCard({ label, value, sub, tone = "neutral" }) {
  const toneMap = { up: "text-red-600 bg-red-50", down: "text-emerald-600 bg-emerald-50", neutral: "text-slate-500 bg-slate-100" };
  return (
    <div className="bg-white border border-slate-200 rounded-lg p-4">
      <div className="text-[11px] tracking-wide text-slate-500 uppercase font-medium">{label}</div>
      <div className="text-3xl font-bold text-slate-900 mt-1">{value}</div>
      {sub && <span className={`inline-block mt-2 text-xs font-medium px-2 py-0.5 rounded ${toneMap[tone]}`}>{sub}</span>}
    </div>
  );
}

function Badge({ children, tone = "slate" }) {
  const map = { slate: "bg-slate-100 text-slate-600", red: "bg-red-100 text-red-700", amber: "bg-amber-100 text-amber-700", green: "bg-emerald-100 text-emerald-700", blue: "bg-blue-100 text-blue-700" };
  return <span className={`text-[11px] font-semibold px-2 py-0.5 rounded whitespace-nowrap ${map[tone]}`}>{children}</span>;
}

function HexMap({ highlight }) {
  const hexes = React.useMemo(() => Array.from({ length: 48 }).map(() => {
    const r = Math.random();
    return r > 0.85 ? "#dc2626" : r > 0.65 ? "#f59e0b" : r > 0.4 ? "#818cf8" : "#334155";
  }), []);
  return (
    <div className="relative bg-slate-900 rounded-lg overflow-hidden h-full min-h-[280px] flex items-center justify-center">
      <svg viewBox="0 0 400 260" className="w-full h-full">
        {hexes.map((c, i) => {
          const cols = 8, row = Math.floor(i / cols), col = i % cols;
          const x = col * 48 + (row % 2 === 0 ? 0 : 24) + 20, y = row * 40 + 20;
          return (
            <polygon key={i} points="20,0 40,11.5 40,34.5 20,46 0,34.5 0,11.5"
              transform={`translate(${x - 20}, ${y - 23}) scale(0.55)`}
              fill={c} opacity="0.75" stroke="#0f172a" strokeWidth="1" />
          );
        })}
      </svg>
      {highlight && <div className="absolute bottom-3 left-3 bg-slate-950/80 text-white text-xs px-2 py-1 rounded border border-slate-700">{highlight}</div>}
    </div>
  );
}
